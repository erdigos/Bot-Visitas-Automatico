name: Bucle Infinito de Visitas

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar los archivos
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Ejecutar el bot de visitas
      run: python bot.py

    - name: Disparar el siguiente bot de inmediato
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run ejecutar.yml --ref main
